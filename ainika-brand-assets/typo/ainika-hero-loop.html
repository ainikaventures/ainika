<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>ainika. hero loop</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0E10; color: #FAFAF7; display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; }
  .wordmark { font-weight: 700; font-size: clamp(72px, 18vw, 240px); letter-spacing: -0.04em; line-height: 1; white-space: nowrap; }
  .wordmark .dot { color: #FF5B2E; animation: blink 1s step-end infinite; }
  .wordmark .suffix { display: inline-block; overflow: hidden; vertical-align: bottom; max-width: 6em; animation: collapse 10s cubic-bezier(0.65,0,0.35,1) infinite; }
  @keyframes blink { 0%,50%,100% {opacity:1} 25%,75% {opacity:.15} }
  @keyframes collapse { 0%,50% {max-width:6em;opacity:1} 55%,95% {max-width:0;opacity:0} 100% {max-width:6em;opacity:1} }
  @media (prefers-reduced-motion: reduce) { .wordmark .dot, .wordmark .suffix { animation: none; } }
</style></head>
<body><div class="wordmark"><span>ai</span><span class="suffix">nika</span><span class="dot">.</span></div></body></html>
